<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Linking Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input {
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <p>
        This is an example for linking JavaScript with HTML
        using a script tag.
    </p>

    <form>
        <input id="username" type="text" placeholder="Enter your name">
        <br><br>

        <button type="button" onclick="Example()">Click Me</button>
    </form>

    <script>
        function Example() {
            console.log("working");

            let name = document.getElementById("username").value;

            document.write("Hello " + name);
        }
    </script>

</body>
</html>
