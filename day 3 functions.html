<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
</head>

<body>

    <h1>JavaScript Functions</h1>

    <button onclick="trial()">Click Me</button>

    <script>

        // ==============================
        // 1. PURE FUNCTION
        // ==============================

        // A pure function gives the same output
        // for the same input and does not change
        // anything outside the function.

        function addNumbers(a, b) {
            return a + b;
        }

        console.log("Pure Function:", addNumbers(5, 10));


        // ==============================
        // 2. ANONYMOUS FUNCTION
        // ==============================

        // An anonymous function is a function
        // without a name.

        var addition = (function(a, b) {
            return a + b;
        })(5, 10);

        function trial() {
            document.write("Anonymous Function Result: " + (addition + 1));
        }


        // ==============================
        // 3. ARROW FUNCTION
        // ==============================

        // Arrow functions provide a shorter
        // way to write functions.

        const add = (a, b) => a + b;

        console.log("Arrow Function:", add(2, 3));


        // Arrow function with one parameter

        const square = n => n * n;

        console.log("Square:", square(4));


        // Arrow function with multiple lines

        const greet = name => {
            const message = `Hello, ${name}!`;
            return message;
        };

        console.log(greet("MCET"));


        // ==============================
        // 4. CALLBACK FUNCTION
        // ==============================

        // A callback function is passed as an
        // argument to another function.

        function fetchData(callback) {

            setTimeout(() => {

                const data = "Data fetched successfully!";

                callback(data);

            }, 2000);
        }

        fetchData(function(result) {
            console.log("Callback Function:", result);
        });


        // ==============================
        // 5. HIGHER-ORDER FUNCTION
        // ==============================

        // A higher-order function takes another
        // function as an argument or returns
        // a function.
